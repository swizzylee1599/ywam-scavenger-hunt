<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>YWAM Siem Reap Scavenger Hunt</title>
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--ink:#172033;--muted:#6b7280;--navy:#0f172a;--navy2:#1e293b;
  --gold:#f4c542;--goldSoft:#fff7d6;--line:#e5e7eb;--ok:#15803d;--okbg:#dcfce7;
  --danger:#b91c1c;--dangerbg:#fee2e2;--shadow:0 8px 30px rgba(15,23,42,.08)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--ink);padding-bottom:calc(88px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none
}
button,input{font:inherit}
button{touch-action:manipulation}
.app{max-width:720px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px 18px}
.hero{
  background:linear-gradient(135deg,#0f172a,#1f2937 75%);color:#fff;border-radius:28px;padding:24px 20px;
  margin:4px 0 16px;box-shadow:0 16px 40px rgba(15,23,42,.18);position:relative;overflow:hidden
}
.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:#ffffff10;right:-60px;top:-70px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;font-weight:900}
h1{font-size:30px;line-height:1.05;margin:8px 0 8px}
h2{font-size:22px;margin:0 0 12px}
h3{margin:0 0 6px;font-size:18px}
p{line-height:1.45}
.card{
  background:var(--card);border:1px solid rgba(15,23,42,.05);border-radius:22px;padding:17px;margin:12px 0;
  box-shadow:var(--shadow)
}
label{display:block;font-size:13px;font-weight:900;margin:14px 0 6px}
input{
  width:100%;padding:15px;border:1px solid #d1d5db;border-radius:15px;background:#fff;color:var(--ink);
  min-height:50px
}
input:focus{outline:3px solid #f4c54255;border-color:#d5ad1d}
button{
  border:0;border-radius:15px;padding:14px 16px;background:var(--navy);color:#fff;font-weight:900;min-height:48px;
  cursor:pointer
}
button:disabled{opacity:.55;cursor:not-allowed}
.primary{width:100%;margin-top:14px}
.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.hidden{display:none!important}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:var(--goldSoft);
  font-size:13px;font-weight:950;color:#6b5200
}
.small{font-size:13px;color:var(--muted)}
.team-title{font-size:29px;font-weight:950;margin-top:3px}
.members{margin-top:10px;display:flex;gap:7px;flex-wrap:wrap}
.member{background:#f3f4f6;border-radius:999px;padding:8px 11px;font-size:13px;font-weight:800}
.challenge{position:relative;overflow:hidden;transition:transform .15s ease}
.challenge:active{transform:scale(.995)}
.challenge.done{border-color:#bbf7d0;background:#f0fdf4}
.challenge p{margin:7px 0 14px;color:#6b7280}
.category{font-size:11px;font-weight:950;text-transform:uppercase;letter-spacing:.08em;color:#64748b}
.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:12px}
.progress>div{height:100%;background:linear-gradient(90deg,#f4c542,#ffd84d);width:0;transition:width .35s ease}
.tabs{
  position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:20
}
.tabs button{background:transparent;color:#6b7280;flex:1;max-width:220px;font-size:12px;padding:10px 5px;min-height:52px}
.tabs button.active{background:var(--navy);color:#fff}
.leader{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rank{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#f3f4f6;font-weight:950;flex:none}
.rank.top1{background:#fff3b0}.rank.top2{background:#f3f4f6}.rank.top3{background:#f5dfc8}
.score{font-size:20px;font-weight:950;white-space:nowrap}
.feed-img,.feed-video{
  width:100%;border-radius:16px;margin-top:12px;max-height:420px;object-fit:cover;background:#111
}
.notice{padding:11px 12px;border-radius:13px;margin-top:12px;font-size:14px}
.error{background:var(--dangerbg);color:var(--danger)}.success{background:var(--okbg);color:var(--ok)}
.loadingLine{font-size:13px;color:var(--muted);padding:10px 4px}
.overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.58);display:grid;place-items:end center;z-index:50;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom))
}
.sheet{
  width:min(720px,100%);background:#fff;border-radius:26px;padding:18px;max-height:88vh;overflow:auto;
  box-shadow:0 20px 50px rgba(0,0,0,.28)
}
.sheet-actions{display:flex;gap:10px;margin-top:14px}.sheet-actions button{flex:1}
.bonusBox{background:#f8fafc;border-radius:14px;padding:12px;margin-top:10px}
.preview{
  width:100%;max-height:280px;object-fit:cover;border-radius:16px;background:#111;margin-top:10px
}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.confetti span{position:absolute;top:-30px;font-size:24px;animation:fall 1.7s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.95}}
.statusbar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 0
}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#047857;font-weight:900}
.dot{width:8px;height:8px;border-radius:50%;background:#10b981;box-shadow:0 0 0 5px #10b9811a}
.refreshBtn{background:#eef2ff;color:#334155;padding:9px 12px;min-height:38px;font-size:12px}
@media (max-width:420px){
  h1{font-size:27px}.card{border-radius:19px;padding:15px}.hero{border-radius:24px;padding:22px 18px}
  .team-title{font-size:26px}.score{font-size:18px}
}
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <div class="eyebrow">YWAM National Staff Conference</div>
    <h1>Siem Reap Scavenger Hunt</h1>
    <div>Join your team. Explore the city. Climb the leaderboard.</div>
  </div>

  <section id="joinView">
    <div class="card">
      <h2>Join the Hunt</h2>
      <p class="small">Enter your name and YWAM base/location. We’ll automatically place you on a team of 4–5.</p>
      <label for="name">Your name</label>
      <input id="name" autocomplete="name" autocapitalize="words" placeholder="e.g. Andrew">
      <label for="base">YWAM base / location</label>
      <input id="base" autocapitalize="words" placeholder="e.g. Siem Reap, Poipet, Phnom Penh">
      <button id="joinBtn" class="primary">Find My Team</button>
      <div id="joinMsg"></div>
    </div>
  </section>

  <section id="appView" class="hidden">
    <div class="card">
      <div class="eyebrow" style="color:#64748b">YOUR TEAM</div>
      <div id="teamName" class="team-title"></div>
      <div class="statusbar">
        <div id="teamScore" class="pill"></div>
        <div class="live"><span class="dot"></span>LIVE</div>
      </div>
      <div id="members" class="members"></div>
      <div class="progress"><div id="progressBar"></div></div>
      <div id="progressText" class="small" style="margin-top:7px"></div>
    </div>

    <div class="row between" style="padding:0 4px">
      <div id="syncText" class="small">Updated just now</div>
      <button id="refreshBtn" class="refreshBtn">Refresh</button>
    </div>

    <div id="challengesView"></div>
    <div id="leaderboardView" class="hidden"></div>
    <div id="feedView" class="hidden"></div>
  </section>
</div>

<div id="tabs" class="tabs hidden">
  <button class="active" data-tab="challenges">🎯<br>Challenges</button>
  <button data-tab="leaderboard">🏆<br>Leaderboard</button>
  <button data-tab="feed">📸<br>Feed</button>
</div>

<div id="uploadOverlay" class="overlay hidden">
  <div class="sheet">
    <div class="row between">
      <div>
        <div class="eyebrow" style="color:#64748b">COMPLETE CHALLENGE</div>
        <h2 id="uploadTitle" style="margin-top:4px"></h2>
      </div>
      <button id="closeSheet" class="ghost">✕</button>
    </div>
    <p id="uploadDesc" class="small"></p>

    <label for="mediaInput">Photo / video</label>
    <input id="mediaInput" type="file">
    <img id="imagePreview" class="preview hidden" alt="Selected photo preview">
    <video id="videoPreview" class="preview hidden" controls playsinline></video>

    <div id="bonusWrap" class="bonusBox hidden">
      <label id="bonusLabel" for="bonusInput">Bonus units</label>
      <input id="bonusInput" type="number" min="0" inputmode="numeric" value="0">
      <div id="bonusHint" class="small" style="margin-top:6px"></div>
    </div>

    <div id="uploadMsg"></div>
    <div class="sheet-actions">
      <button id="submitUpload">Submit Challenge</button>
    </div>
  </div>
</div>

<div id="confetti" class="confetti"></div>

<script>
const API="https://zarxbmmnfmaorwjfopuu.supabase.co/functions/v1/hunt-api";
const $=id=>document.getElementById(id);
let state=null,currentChallenge=null,session=localStorage.getItem("hunt_session")||"",lastSync=Date.now();

async function api(action,body={},method="POST"){
  const o={method,headers:{"Content-Type":"application/json"}};
  if(session)o.headers["x-hunt-session"]=session;
  if(method!=="GET")o.body=JSON.stringify(body);
  const controller=new AbortController();
  const t=setTimeout(()=>controller.abort(),20000);
  o.signal=controller.signal;
  try{
    const r=await fetch(`${API}?action=${encodeURIComponent(action)}`,o);
    const d=await r.json().catch(()=>({error:"Invalid server response"}));
    if(!r.ok||d.error)throw Error(d.error||"Request failed");
    return d;
  }finally{clearTimeout(t)}
}

function msg(el,text,type="error"){el.innerHTML=text?`<div class="notice ${type}">${text}</div>`:""}

async function join(){
  const name=$("name").value.trim(),base=$("base").value.trim();
  if(!name||!base)return msg($("joinMsg"),"Please enter your name and base/location.");
  $("joinBtn").disabled=true;$("joinBtn").textContent="Finding your team…";
  try{
    const d=await api("join",{name,base,session});
    session=d.session;localStorage.setItem("hunt_session",session);
    await loadState(true);
  }catch(e){msg($("joinMsg"),friendlyError(e))}
  finally{$("joinBtn").disabled=false;$("joinBtn").textContent="Find My Team"}
}

async function loadState(first=false){
  try{
    state=await api("state",{},"GET");
    lastSync=Date.now();
    $("joinView").classList.add("hidden");$("appView").classList.remove("hidden");$("tabs").classList.remove("hidden");
    renderAll();updateSyncText();
    if(first)celebrate();
  }catch(e){
    if(String(e.message).includes("Session")){localStorage.removeItem("hunt_session");session="";location.reload()}
  }
}

function renderAll(){
  const my=state.leaders?.find(x=>x.team_id===state.team.id);
  $("teamName").textContent=state.team.name;
  $("teamScore").textContent=`${my?.score||0} pts`;
  $("members").innerHTML=(state.members||[]).map(m=>`<span class="member">${esc(m.display_name)} · ${esc(m.base_name)}</span>`).join("");
  const total=state.challenges?.length||0,done=state.completed?.length||0;
  $("progressBar").style.width=total?`${Math.round(done/total*100)}%`:"0%";
  $("progressText").textContent=`${done} of ${total} challenges completed`;
  renderChallenges();renderLeaderboard();renderFeed();
}

function renderChallenges(){
  const done=new Set(state.completed||[]);
  $("challengesView").innerHTML=`<h2 style="margin:20px 4px 8px">Challenges</h2>`+
  (state.challenges||[]).map(c=>`
    <div class="card challenge ${done.has(c.id)?"done":""}">
      <div class="row between wrap">
        <div><div class="category">${esc(c.category||"challenge")}</div><h3>${done.has(c.id)?"✅ ":""}${esc(c.title)}</h3></div>
        <span class="pill">${c.base_points?c.base_points+" pts":c.bonus_points_per_unit+" pts each"}</span>
      </div>
      <p>${esc(c.description||"")}</p>
      ${done.has(c.id)?'<div class="notice success">Completed by your team 🎉</div>':`<button onclick="openChallenge('${c.id}')">📷 Complete Challenge</button>`}
    </div>`).join("");
}

function renderLeaderboard(){
  $("leaderboardView").innerHTML=`<h2 style="margin:20px 4px 8px">Live Leaderboard</h2>`+
  ((state.leaders||[]).map((x,i)=>`
    <div class="card leader">
      <div class="row">
        <div class="rank ${i===0?'top1':i===1?'top2':i===2?'top3':''}">${i+1}</div>
        <div><h3>${esc(x.name)}</h3><div class="small">${x.member_count} members · ${x.challenges_completed} completed</div></div>
      </div>
      <div class="score">${x.score} pts</div>
    </div>`).join("")||'<div class="card">No scores yet — be first!</div>');
}

function renderFeed(){
  $("feedView").innerHTML=`<h2 style="margin:20px 4px 8px">Live Feed</h2>`+
  ((state.feed||[]).map(x=>`
    <div class="card">
      <div class="row between wrap">
        <div><b>${esc(x.team_name)}</b> completed <b>${esc(x.challenge_title)}</b></div>
        <span class="pill">+${x.points_awarded} pts</span>
      </div>
      <div class="small" style="margin-top:5px">${new Date(x.created_at).toLocaleString()}</div>
      ${x.media_url?(x.media_type==="video"?`<video class="feed-video" controls playsinline preload="metadata" src="${x.media_url}"></video>`:`<img class="feed-img" loading="lazy" src="${x.media_url}" alt="Challenge submission">`):""}
    </div>`).join("")||'<div class="card">No posts yet. The race is waiting!</div>');
}

function openChallenge(id){
  currentChallenge=state.challenges.find(c=>c.id===id);if(!currentChallenge)return;
  $("uploadTitle").textContent=currentChallenge.title;$("uploadDesc").textContent=currentChallenge.description||"";
  $("mediaInput").accept=currentChallenge.media_kind==="video"?"video/*":currentChallenge.media_kind==="photo"?"image/*":"image/*,video/*";
  $("mediaInput").value="";hidePreviews();$("bonusInput").value=0;
  if(currentChallenge.max_bonus_units>0){
    $("bonusWrap").classList.remove("hidden");
    $("bonusLabel").textContent=currentChallenge.bonus_label||"Bonus units";
    $("bonusInput").max=currentChallenge.max_bonus_units;
    $("bonusHint").textContent=`Up to ${currentChallenge.max_bonus_units}. +${currentChallenge.bonus_points_per_unit} points each.`;
  }else $("bonusWrap").classList.add("hidden");
  msg($("uploadMsg"),"");$("uploadOverlay").classList.remove("hidden");
}

$("mediaInput").addEventListener("change",()=>{
  hidePreviews();const f=$("mediaInput").files[0];if(!f)return;
  const url=URL.createObjectURL(f);
  if(f.type.startsWith("video")){$("videoPreview").src=url;$("videoPreview").classList.remove("hidden")}
  else{$("imagePreview").src=url;$("imagePreview").classList.remove("hidden")}
});

function hidePreviews(){
  $("imagePreview").classList.add("hidden");$("videoPreview").classList.add("hidden");
  $("videoPreview").removeAttribute("src");$("imagePreview").removeAttribute("src");
}

async function submitChallenge(){
  let f=$("mediaInput").files[0];if(!f)return msg($("uploadMsg"),"Please choose a photo or video.");
  const type=f.type.startsWith("video")?"video":"photo";
  if(currentChallenge.media_kind!=="either"&&currentChallenge.media_kind!==type)
    return msg($("uploadMsg"),`This challenge requires a ${currentChallenge.media_kind}.`);
  $("submitUpload").disabled=true;$("submitUpload").textContent=type==="photo"?"Preparing photo…":"Uploading video…";
  try{
    if(type==="photo")f=await compressImage(f,1600,.82);
    if(f.size>12*1024*1024)throw Error("File is still too large. Please choose a shorter video or smaller file.");
    $("submitUpload").textContent="Uploading…";
    const data=await fileToDataURL(f);
    await api("upload",{challengeId:currentChallenge.id,mediaType:type,mime:f.type||"image/jpeg",data:data.split(",")[1],bonus:Number($("bonusInput").value||0)});
    $("uploadOverlay").classList.add("hidden");celebrate();await loadState();setTab("challenges");
  }catch(e){msg($("uploadMsg"),friendlyError(e))}
  finally{$("submitUpload").disabled=false;$("submitUpload").textContent="Submit Challenge"}
}

function compressImage(file,maxDim=1600,quality=.82){
  return new Promise((resolve,reject)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      let {width,height}=img;
      const scale=Math.min(1,maxDim/Math.max(width,height));width=Math.round(width*scale);height=Math.round(height*scale);
      const canvas=document.createElement("canvas");canvas.width=width;canvas.height=height;
      const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,width,height);
      canvas.toBlob(blob=>{URL.revokeObjectURL(url);blob?resolve(new File([blob],"upload.jpg",{type:"image/jpeg"})):reject(Error("Could not prepare photo"))},"image/jpeg",quality);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(Error("Could not read photo"))};img.src=url;
  });
}

function fileToDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function setTab(t){["challenges","leaderboard","feed"].forEach(x=>$(`${x}View`).classList.toggle("hidden",x!==t));document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t))}
function updateSyncText(){const s=Math.max(0,Math.floor((Date.now()-lastSync)/1000));$("syncText").textContent=s<8?"Updated just now":`Updated ${s}s ago`}
function friendlyError(e){if(e?.name==="AbortError")return"Connection timed out. Please try again.";return e?.message||"Something went wrong. Please try again."}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function celebrate(){const c=$("confetti");c.innerHTML="";for(let i=0;i<28;i++){const s=document.createElement("span");s.textContent=["🎉","✨","⭐","🥳","💥"][Math.floor(Math.random()*5)];s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.45+"s";c.appendChild(s)}setTimeout(()=>c.innerHTML="",2200)}

$("joinBtn").onclick=join;$("closeSheet").onclick=()=>$("uploadOverlay").classList.add("hidden");$("submitUpload").onclick=submitChallenge;$("refreshBtn").onclick=()=>loadState();
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
if(session)loadState();
setInterval(()=>{if(session&&!document.hidden)loadState()},10000);
setInterval(updateSyncText,1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&session)loadState()});
</script>
</body>
</html>
